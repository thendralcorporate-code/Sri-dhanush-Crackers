<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sri Dhanush Crackers - Checkout Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .form-container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      color: #8c1d1d;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
    .optional-text {
      color: #777;
      font-weight: normal;
      font-size: 13px;
    }
    input[type="text"],
    input[type="tel"],
    textarea,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 14px;
    }
    textarea {
      resize: vertical;
      height: 80px;
    }
    .btn-submit {
      width: 100%;
      background-color: #8c1d1d;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background-color: #6b1414;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Sri Dhanush Crackers - Order Form</h2>
  
  <form id="orderForm">
    <!-- Customer Name -->
    <div class="form-group">
      <label for="name">Customer Name / பெயர் <span style="color:red;">*</span></label>
      <input type="text" id="name" name="name" required placeholder="Enter your full name">
    </div>

    <!-- Mobile Number -->
    <div class="form-group">
      <label for="mobile">Mobile Number / போன் எண் <span style="color:red;">*</span></label>
      <input type="tel" id="mobile" name="mobile" required placeholder="10-digit mobile number">
    </div>

    <!-- Delivery Address -->
    <div class="form-group">
      <label for="address">Delivery Address / முகவரி <span style="color:red;">*</span></label>
      <textarea id="address" name="address" required placeholder="Door No, Street Name, Town/Village"></textarea>
    </div>

    <!-- District Location (Optional) -->
    <div class="form-group">
      <label for="district">District Location / மாவட்டம் <span class="optional-text">(Optional)</span></label>
      <input type="text" id="district" name="district" placeholder="E.g. Madurai, Coimbatore, Chennai">
    </div>

    <!-- Preferred Transport (Optional) -->
    <div class="form-group">
      <label for="transport">Preferred Transport / விருப்பமான டிரான்ஸ்போர்ட் <span class="optional-text">(Optional)</span></label>
      <input type="text" id="transport" name="transport" placeholder="E.g. KPN, VRL, Any Private Transport">
    </div>

    <!-- Payment Type -->
    <div class="form-group">
      <label for="paymentType">Payment Type / பணம் செலுத்தும் முறை</label>
      <select id="paymentType" name="paymentType">
        <option value="Online Payment">Online Payment (GPay/PhonePe)</option>
        <option value="Bank Transfer">Bank Transfer</option>
        <option value="Cash on Delivery">Cash on Delivery</option>
      </select>
    </div>

    <!-- Dynamic Hidden Fields for Order Items & Total Amount -->
    <input type="hidden" id="items" name="items" value="">
    <input type="hidden" id="total" name="total" value="0">

    <button type="submit" class="btn-submit">Submit Order / ஆர்டர் செய்</button>
  </form>
</div>

<script>
  // Your Live Apps Script Deployment Web App URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMPFWaAUAUGkoPKP18pgsTEqRXUM90sUhFv4zBpn1aAV0JQz5TnP6PpyWrUs29mfHiLQ/exec";

  document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const submitBtn = document.querySelector(".btn-submit");
    submitBtn.innerText = "Submitting Order...";
    submitBtn.disabled = true;

    // Convert Form Data to URLSearchParams to prevent Google Script CORS/HTML Errors
    const formData = new FormData(this);
    const payload = new URLSearchParams(formData);

    fetch(SCRIPT_URL, {
      method: "POST",
      body: payload
    })
    .then(response => response.json())
    .then(data => {
      if(data.result === "success") {
        alert("Order Placed Successfully! Your Order ID: " + data.orderId);
        document.getElementById("orderForm").reset();
      } else {
        alert("Error placing order: " + (data.error || "Unknown Error"));
      }
    })
    .catch(error => {
      alert("Submission Error: " + error.message);
    })
    .finally(() => {
      submitBtn.innerText = "Submit Order / ஆர்டர் செய்";
      submitBtn.disabled = false;
    });
  });
</script>

</body>
</html>
