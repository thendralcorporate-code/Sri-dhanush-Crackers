<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Dhanush Crackers - Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Supabase CDN Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-bg { background-color: #8b0000; color: white; padding: 20px; text-align: center; }
        .card-custom { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
        .table-dark-custom { background-color: #1a252f; color: white; }

        @media print {
            body * { visibility: hidden; }
            #printableModal, #printableModal * { visibility: visible; }
            #printableModal { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="header-bg no-print">
        <h2>SRI DHANUSH CRACKERS</h2>
        <p>Sivakasi | Staff Portal</p>
    </div>

    <div class="container my-4 no-print">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="text-danger fw-bold">📋 Received Orders Master Table</h4>
            <button class="btn btn-primary" onclick="loadOrders()">🔄 Refresh Orders</button>
        </div>

        <div class="card card-custom p-3">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle text-center">
                    <thead class="table-dark-custom">
                        <tr>
                            <th>Order ID / Date</th>
                            <th>Customer Name</th>
                            <th>Mobile / District</th>
                            <th>Type / Status</th>
                            <th>Staff</th>
                            <th>Total Amount</th>
                            <th>Payment Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="8" class="text-center py-4">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="mt-2 mb-0">ஆர்டர்கள் லோட் ஆகிறது...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Order View & Print Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg" id="printableModal">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">SRI DHANUSH CRACKERS - Order Invoice</h5>
                    <button type="button" class="btn-close btn-close-white no-print" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="modalDetails">
                    <!-- Dynamic Details Will Load Here -->
                </div>
                <div class="modal-footer no-print">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success" onclick="window.print()">🖨️ Print / Download PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://uviquxhyywthznpnqmnx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2aXF1eGh5eXd0aHpucG5xbW54Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODk1MjU0MCwiZXhwIjoyMTA0NTI4NTQwfQ.-8lymr2NrPGjk5qEZ6QBkUMJrsUWHUDY52lZyzif358';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allOrders = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
        });

        async function loadOrders() {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" class="text-center py-4">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 mb-0">ஆர்டர்கள் லோட் ஆகிறது...</p>
                    </td>
                </tr>`;

            try {
                const { data: orders, error } = await _supabase
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allOrders = orders || [];

                if (allOrders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">ஆர்டர்கள் எதுவும் இல்லை!</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                allOrders.forEach(order => {
                    const dateStr = order.created_at ? new Date(order.created_at).toLocaleDateString('en-IN') : 'N/A';
                    
                    const row = `
                        <tr>
                            <td><strong>${order.id || 'N/A'}</strong><br><small class="text-muted">${dateStr}</small></td>
                            <td>${order.customer_name || 'Customer'}</td>
                            <td>${order.mobile || '-'}<br><small class="text-muted">${order.district || ''}</small></td>
                            <td>
                                <span class="badge bg-info text-dark">${order.order_type || 'Online'}</span><br>
                                <span class="badge bg-warning text-dark mt-1">${order.order_status || 'Booked'}</span>
                            </td>
                            <td><span class="badge bg-secondary">${order.allocated_staff || 'Not Assigned'}</span></td>
                            <td class="fw-bold text-success">₹${order.total_amount || 0}</td>
                            <td>
                                <span class="badge ${order.payment_status === 'YES' ? 'bg-success' : 'bg-danger'}">
                                    ${order.payment_status === 'YES' ? 'PAID' : 'PENDING'}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="viewOrder('${order.id}')">👁️ View / PDF</button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

            } catch (error) {
                console.error('Error fetching orders:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center text-danger py-4">
                            ❌ ஆர்டர்களை லோட் செய்ய முடியவில்லை! (<small>${error.message}</small>)
                        </td>
                    </tr>`;
            }
        }

        function viewOrder(id) {
            const order = allOrders.find(o => o.id === id);
            if (!order) return;

            let itemsList = '';
            let rawItems = order.items || order.cart || order.products || [];

            if (typeof rawItems === 'string') {
                try { rawItems = JSON.parse(rawItems); } catch(e) { rawItems = []; }
            }

            if (Array.isArray(rawItems) && rawItems.length > 0) {
                rawItems.forEach((item, index) => {
                    const name = item.tam_name || item.eng_name || item.name || 'Item ' + (index+1);
                    const qty = item.quantity || item.qty || 1;
                    const price = item.price || 0;
                    const total = qty * price;

                    itemsList += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${name}</td>
                            <td>${qty}</td>
                            <td>₹${price}</td>
                            <td>₹${total}</td>
                        </tr>
                    `;
                });
            } else {
                itemsList = `<tr><td colspan="5" class="text-center text-muted">பொருள்கள் விவரம் தனியாகக் கிடைக்கவில்லை</td></tr>`;
            }

            const modalHtml = `
                <div class="row mb-3">
                    <div class="col-6">
                        <h6><strong>Order ID:</strong> ${order.id}</h6>
                        <p class="mb-1"><strong>Customer:</strong> ${order.customer_name || 'N/A'}</p>
                        <p class="mb-1"><strong>Mobile:</strong> ${order.mobile || 'N/A'}</p>
                        <p class="mb-1"><strong>Address:</strong> ${order.address || ''}, ${order.district || ''}</p>
                    </div>
                    <div class="col-6 text-end">
                        <p class="mb-1"><strong>Date:</strong> ${order.created_at ? new Date(order.created_at).toLocaleString('en-IN') : 'N/A'}</p>
                        <p class="mb-1"><strong>Status:</strong> <span class="badge bg-warning text-dark">${order.order_status || 'Booked'}</span></p>
                        <p class="mb-1"><strong>Payment:</strong> <span class="badge ${order.payment_status === 'YES' ? 'bg-success' : 'bg-danger'}">${order.payment_status === 'YES' ? 'PAID' : 'PENDING'}</span></p>
                    </div>
                </div>
                <hr>
                <h6 class="fw-bold mb-3">Ordered Products List:</h6>
                <table class="table table-bordered text-center align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Product Name</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${itemsList}
                    </tbody>
                </table>
                <div class="text-end mt-3">
                    <h4><strong>Total Amount: ₹${order.total_amount || 0}</strong></h4>
                </div>
            `;

            document.getElementById('modalDetails').innerHTML = modalHtml;
            const modal = new bootstrap.Modal(document.getElementById('orderModal'));
            modal.show();
        }
    </script>
</body>
</html>
