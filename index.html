<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Dhanush Crackers - Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Supabase CDN Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-bg { background-color: #8b0000; color: white; padding: 20px; text-align: center; }
        .card-custom { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
        .table-dark-custom { background-color: #1a252f; color: white; }

        /* Traditional Bill Box Styling */
        .bill-box {
            border: 2px solid #000;
            padding: 20px;
            background: #fff;
            color: #000;
        }
        .bill-header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .bill-table th, .bill-table td {
            border: 1px solid #000 !important;
            padding: 6px;
        }

        @media print {
            body * { visibility: hidden; }
            #printableBill, #printableBill * { visibility: visible; }
            #printableBill { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="header-bg no-print">
        <h2>SRI DHANUSH CRACKERS</h2>
        <p>Sivakasi | Staff Portal</p>
    </div>

    <div class="container my-4 no-print">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="text-danger fw-bold">📋 Received Orders Master Table</h4>
            <button class="btn btn-primary" onclick="loadOrders()">🔄 Refresh Orders</button>
        </div>

        <div class="card card-custom p-3">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle text-center">
                    <thead class="table-dark-custom">
                        <tr>
                            <th>Order ID / Date</th>
                            <th>Customer Name</th>
                            <th>Mobile / District</th>
                            <th>Type / Status</th>
                            <th>Staff</th>
                            <th>Total Amount</th>
                            <th>Payment Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="8" class="text-center py-4">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="mt-2 mb-0">ஆர்டர்கள் லோட் ஆகிறது...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Order Bill Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white no-print">
                    <h5 class="modal-title">Order Invoice Preview</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-3" id="printableBill">
                    <!-- Dynamic Bill Format Will Load Here -->
                </div>
                <div class="modal-footer no-print">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success fw-bold" onclick="window.print()">🖨️ Print / Save PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://uviquxhyywthznpnqmnx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2aXF1eGh5eXd0aHpucG5xbW54Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODk1MjU0MCwiZXhwIjoyMTA0NTI4NTQwfQ.-8lymr2NrPGjk5qEZ6QBkUMJrsUWHUDY52lZyzif358';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allOrders = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
        });

        async function loadOrders() {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" class="text-center py-4">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 mb-0">ஆர்டர்கள் லோட் ஆகிறது...</p>
                    </td>
                </tr>`;

            try {
                const { data: orders, error } = await _supabase
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allOrders = orders || [];

                if (allOrders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">ஆர்டர்கள் எதுவும் இல்லை!</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                allOrders.forEach(order => {
                    const dateStr = order.created_at ? new Date(order.created_at).toLocaleDateString('en-IN') : 'N/A';
                    
                    const row = `
                        <tr>
                            <td><strong>${order.id || 'N/A'}</strong><br><small class="text-muted">${dateStr}</small></td>
                            <td>${order.customer_name || 'Customer'}</td>
                            <td>${order.mobile || '-'}<br><small class="text-muted">${order.district || ''}</small></td>
                            <td>
                                <span class="badge bg-info text-dark">${order.order_type || 'Online'}</span><br>
                                <span class="badge bg-warning text-dark mt-1">${order.order_status || 'Booked'}</span>
                            </td>
                            <td><span class="badge bg-secondary">${order.allocated_staff || 'Not Assigned'}</span></td>
                            <td class="fw-bold text-success">₹${order.total_amount || 0}</td>
                            <td>
                                <span class="badge ${order.payment_status === 'YES' ? 'bg-success' : 'bg-danger'}">
                                    ${order.payment_status === 'YES' ? 'PAID' : 'PENDING'}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-primary fw-bold" onclick="viewOrder('${order.id}')">🧾 View Bill</button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

            } catch (error) {
                console.error('Error fetching orders:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center text-danger py-4">
                            ❌ ஆர்டர்களை லோட் செய்ய முடியவில்லை! (<small>${error.message}</small>)
                        </td>
                    </tr>`;
            }
        }

        function viewOrder(id) {
            const order = allOrders.find(o => o.id === id);
            if (!order) return;

            let itemsList = '';
            let rawItems = order.items || order.cart || order.products || [];

            if (typeof rawItems === 'string') {
                try { rawItems = JSON.parse(rawItems); } catch(e) { rawItems = []; }
            }

            let calculatedTotal = 0;

            if (Array.isArray(rawItems) && rawItems.length > 0) {
                rawItems.forEach((item, index) => {
                    const name = item.tam_name || item.eng_name || item.name || 'Crackers Item ' + (index+1);
                    const qty = Number(item.quantity || item.qty || item.count || 1);
                    
                    // Supabase-ல் rate, price, அல்லது unit_price என எந்த ஃபீல்டில் இருந்தாலும் எடுத்துக்கொள்ளும்
                    const price = Number(item.price || item.rate || item.unit_price || item.amount || 0);
                    const total = qty * price;
                    calculatedTotal += total;

                    itemsList += `
                        <tr>
                            <td class="text-center">${index + 1}</td>
                            <td>${name}</td>
                            <td class="text-center">${qty}</td>
                            <td class="text-end">₹${price.toFixed(2)}</td>
                            <td class="text-end fw-bold">₹${total.toFixed(2)}</td>
                        </tr>
                    `;
                });
            } else {
                itemsList = `<tr><td colspan="5" class="text-center text-muted">பொருள்கள் விவரம் தனியாகக் கிடைக்கவில்லை</td></tr>`;
            }

            const finalAmount = order.total_amount || calculatedTotal || 0;

            const billHtml = `
                <div class="bill-box">
                    <div class="bill-header">
                        <h3 class="fw-bold mb-0 text-uppercase">SRI DHANUSH CRACKERS</h3>
                        <p class="mb-0 small">Sivakasi Main Road, Sivakasi - 626123</p>
                        <p class="mb-0 small">Ph: +91 9790277113 | Email: sridhanushcrackers@gmail.com</p>
                        <h5 class="mt-2 text-decoration-underline fw-bold">ESTIMATE / ORDER INVOICE</h5>
                    </div>

                    <div class="row mb-3 small">
                        <div class="col-7">
                            <p class="mb-1"><strong>Customer Name:</strong> ${order.customer_name || 'N/A'}</p>
                            <p class="mb-1"><strong>Mobile No:</strong> ${order.mobile || 'N/A'}</p>
                            <p class="mb-1"><strong>Delivery Address:</strong> ${order.address || ''}, ${order.district || ''}</p>
                        </div>
                        <div class="col-5 text-end">
                            <p class="mb-1"><strong>Order No:</strong> ${order.id}</p>
                            <p class="mb-1"><strong>Date:</strong> ${order.created_at ? new Date(order.created_at).toLocaleDateString('en-IN') : 'N/A'}</p>
                            <p class="mb-1"><strong>Payment Status:</strong> ${order.payment_status === 'YES' ? 'PAID' : 'PENDING'}</p>
                        </div>
                    </div>

                    <table class="table bill-table align-middle small mb-2">
                        <thead>
                            <tr class="table-light text-center">
                                <th style="width: 5%;">S.No</th>
                                <th style="width: 55%;">Product Description</th>
                                <th style="width: 10%;">Qty</th>
                                <th style="width: 15%;">Rate</th>
                                <th style="width: 15%;">Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsList}
                        </tbody>
                    </table>

                    <div class="row mt-3 align-items-center">
                        <div class="col-7">
                            <p class="small mb-0"><strong>Note:</strong> Thank you for your order with Sri Dhanush Crackers! Wishing you a Happy & Safe Diwali.</p>
                        </div>
                        <div class="col-5">
                            <div class="border border-dark p-2 text-end">
                                <h5 class="mb-0 fw-bold">Net Total: ₹${Number(finalAmount).toFixed(2)}</h5>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('printableBill').innerHTML = billHtml;
            const modal = new bootstrap.Modal(document.getElementById('orderModal'));
            modal.show();
        }
    </script>
</body>
</html>
